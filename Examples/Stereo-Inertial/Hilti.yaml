%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "KannalaBrandt8"

# Camera0 calibration and distortion parameters (OpenCV)
Camera1.fx: 351.31400364193297
Camera1.fy: 351.4911744656785
Camera1.cx: 367.8522793375995
Camera1.cy: 253.8402144980996

# Distortion parameters (equidistant model)
Camera1.k1: -0.03696737352869157
Camera1.k2: -0.008917880497032812
Camera1.k3: 0.008912969593422046
Camera1.k4: -0.0037685977496087313

# Camera1 calibration and distortion parameters (OpenCV)
Camera2.fx: 352.6489794433894
Camera2.fy: 352.8586498571586
Camera2.cx: 347.8170010310082
Camera2.cy: 270.5806692485468

# Distortion parameters (equidistant model)
Camera2.k1: -0.039086652082708805
Camera2.k2: -0.005525347047415151
Camera2.k3: 0.004398151558986798
Camera2.k4: -0.0019701263170917808
    
# Transformation matrix from camera 1 to camera 0
Stereo.T_c1_c2: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [ 0.99997614, -0.00470555, 0.00505686, -0.10810011, 
           0.00469811, 0.99998786, 0.00148287, -0.00051888,
          -0.00506377, -0.00145908, 0.99998611, -0.00069755,
          0.0, 0.0, 0.0, 1.0 ]

# Lapping area between images
Camera1.overlappingBegin: 0
Camera1.overlappingEnd: 719

Camera2.overlappingBegin: 0
Camera2.overlappingEnd: 719

# Camera resolution
Camera.width: 720
Camera.height: 540

# Camera frames per second 
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0

# Transformation from body-frame (imu) to camera 0
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.00484977, 0.00156177, 0.99998702, 0.04766175, 
          0.99994143, 0.0096676, -0.00486465, 0.04650256,
         -0.00967507, 0.99995205, -0.00151479, -0.01453843,
          0.0, 0.0, 0.0, 1.0]

# IMU noise (Use those from VINS-mono)
IMU.NoiseGyro: 0.0010679343003532472
IMU.NoiseAcc: 0.0001688956233495657
IMU.GyroWalk: 2.6541629581345176e-05
IMU.AccWalk: 9.782812831313576e-07
IMU.Frequency: 40000.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1000 # Tested with 1250

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
